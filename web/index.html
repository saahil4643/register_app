<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Prabhim One - Invoicing, Billing & Business Management">

  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#6D28D9">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prabhim One">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prabhim One</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F9FAFB;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F9FAFB;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(109, 40, 217, 0.25), 0 8px 10px -6px rgba(109, 40, 217, 0.2);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    .splash-title {
      font-size: 22px;
      font-weight: 700;
      color: #1F2937;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(109, 40, 217, 0.15);
      border-top-color: #6D28D9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <!-- Initial splash screen while Flutter engine initializes -->
  <div id="loading-splash">
    <img src="icons/Icon-192.png" alt="Prabhim One" class="splash-logo" onerror="this.style.display='none'">
    <div class="splash-title">Prabhim One</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // Smoothly fade out the splash screen once the first Flutter frame is painted
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 350);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
